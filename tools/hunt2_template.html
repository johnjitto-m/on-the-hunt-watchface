ox-shadow: 0 0 6px #ffd36b; animation: hem9 4s cubic-bezier(0.1,0.7,0.3,1) 3"></div>

<script type="text/x-dc" data-dc-script data-props='{"timeFont":{"editor":"enum","options":["Oswald Bold","Bebas Neue","Barlow Condensed","Space Grotesk","Bodoni (current)"],"default":"Bebas Neue"},"notifStyle":{"editor":"enum","options":["Both","Intel badge","Dog alert","Off"],"default":"Both"},"notifications":{"editor":"int","default":3},"weather":{"editor":"enum","options":["Off – use backdrop","Clear","Cloudy","Fog / haze","Rain","Thunderstorm","Snow","No weather data"],"default":"Off – use backdrop"},"backdrop":{"editor":"enum","options":["Noir city","City skyline","Grand hotel","Neon club","Rainy street","Subway"],"default":"Noir city"},"state":{"editor":"enum","options":["Standing still","Walking","Charging","Low battery","Adrenaline","Contract fulfilled"],"default":"Walking"},"theme":{"editor":"enum","options":["Continental gold","Blood red","Neon pink","Ink (black & white)"],"default":"Continental gold"},"night":{"editor":"enum","options":["Auto (sunrise / sunset)","Day","Night"],"default":"Auto (sunrise / sunset)"},"sunrise":{"editor":"text","default":"06:14"},"sunset":{"editor":"text","default":"17:52"},"batterySaver":{"editor":"boolean","default":false},"steps":{"editor":"int","default":8157},"goal":{"editor":"int","default":15000},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => this.setState({ now: new Date() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.toastT); }
  showToast(t) {
    clearTimeout(this.toastT);
    this.setState({ toast: t, toastKey: Date.now() });
    this.toastT = setTimeout(() => this.setState({ toast: null }), 1800);
  }
  renderVals() {
    const st = this.state || {};
    const d = st.now || new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const H = d.getHours();
    const state = this.props.state ?? 'Walking';
    const walking = state === 'Walking';
    const tf = { 'Oswald Bold': ["'Oswald', sans-serif", 600, 118, 1], 'Bebas Neue': ["'Bebas Neue', sans-serif", 400, 136, 3], 'Barlow Condensed': ["'Barlow Condensed', sans-serif", 700, 128, 1], 'Space Grotesk': ["'Space Grotesk', sans-serif", 700, 104, -2], 'Bodoni (current)': ["'Bodoni Moda', serif", 600, 110, 0] }[this.props.timeFont ?? 'Bebas Neue'] || ["'Oswald', sans-serif", 600, 118, 1];
    const done = state === 'Contract fulfilled';
    const saver = !!this.props.batterySaver;
    const nCount = Math.max(0, this.props.notifications ?? 3);
    const nStyle = this.props.notifStyle ?? 'Both';
    const badgeOn = nCount > 0 && (nStyle === 'Both' || nStyle === 'Intel badge');
    const dogAlertOn = nCount > 0 && (nStyle === 'Both' || nStyle === 'Dog alert');
    const theme = this.props.theme ?? 'Continental gold';
    const ink = theme === 'Ink (black & white)';
    const nightMode = this.props.night ?? 'Auto (sunrise / sunset)';
    const toMin = (t, dflt) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : dflt; };
    const nowMin = H * 60 + d.getMinutes();
    const rise = toMin(this.props.sunrise, 374), set = toMin(this.props.sunset, 1072);
    const isNight = nightMode === 'Night' || (nightMode !== 'Day' && (nowMin >= set || nowMin < rise));
    let steps = Math.max(0, this.props.steps ?? 8157);
    const goal = Math.max(1, this.props.goal ?? 15000);
    if (state === 'Contract fulfilled') steps = Math.max(steps, Math.round(goal * 1.156));
    const p = Math.min(1, steps / goal);

    const themes = {
      'Ink (black & white)': { accent: '#e9e4d8', text: '#e9e4d8', neon: '#e9e4d8' },
      'Continental gold': { accent: '#d4af37', text: '#ecd27a', neon: '#e0213b' },
      'Blood red': { accent: '#e0213b', text: '#ff7a8a', neon: '#e0213b' },
      'Neon pink': { accent: '#ff2bd6', text: '#ff8ae8', neon: '#29e6ff' }
    };
    let th = themes[theme] || themes['Ink (black & white)'];
    if (isNight && theme === 'Continental gold') th = { accent: '#c8102e', text: '#ff6b7c', neon: '#e0213b' };

    const charging = state === 'Charging';
    const low = state === 'Low battery';
    const adren = state === 'Adrenaline';
    const battery = charging ? 64 : low ? 12 : 78;
    const hr = adren ? 132 : 72;
    const on = Math.round(battery / 10);
    const segs = Array.from({ length: 10 }, (_, i) => {
      if (charging) return { c: i < on ? (ink ? '#e9e4d8' : '#e0213b') : (i === on ? (ink ? '#ffffff' : '#ffd36b') : '#2a2a2e'), anim: i === on ? 'hcharge 1s ease-in-out infinite' : 'none' };
      if (low) return { c: i < on ? (ink ? '#ffffff' : '#ff7a1a') : '#2a2a2e', anim: i < on ? 'hblink 0.8s steps(1) infinite' : 'none' };
      return { c: i < on ? (ink ? '#e9e4d8' : '#e0213b') : '#2a2a2e', anim: 'none' };
    });
    const wx = this.props.weather ?? 'Off – use backdrop';
    const wxMap = { 'Clear': 'Noir city', 'Cloudy': 'Noir city', 'Fog / haze': 'Noir city', 'Rain': 'Rainy street', 'Thunderstorm': 'Rainy street', 'Snow': 'Noir city', 'No weather data': 'Grand hotel' };
    const bd = wxMap[wx] || (this.props.backdrop ?? 'Noir city');
    const tilt = st.tilt ?? 0;
    const sway = (this.props.tiltDemo ?? true) && st.tilt == null;
    const figX = done ? 292 : Math.round(37 + 276 * p);
    const tapper = (label) => () => this.showToast(label);
    return {
      hh: pad(H % 12 || 12), mm: pad(d.getMinutes()),
      tFam: tf[0], tW: tf[1], tSize: tf[2], tLs: tf[3],
      day: ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()],
      date: pad(d.getDate()) + ' ' + ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()],
      battery, heartRate: hr, segs,
      beatDur: (60 / hr).toFixed(2),
      hpText: ink ? (low ? '#ffffff' : '#bdb8ad') : (low ? '#ff9a4a' : '#ff7a8a'),
      hpStatus: charging ? 'RELOADING…' : low ? 'CRITICAL' : 'COMBAT READY',
      isCharging: charging,
      hrText: ink ? (adren ? '#ffffff' : '#bdb8ad') : (adren ? '#ff3b52' : '#ff7a8a'),
      hrNum: ink ? '#ffffff' : (adren ? '#ff3b52' : '#ffffff'),
      heartCol: ink ? '#e9e4d8' : '#ff3b52',
      coinMark: '#1a1408',
      bgFilter: ink ? 'grayscale(1) contrast(1.15)' : 'none',
      hrStatus: adren ? 'ADRENALINE' : 'CALM',
      isAdrenaline: adren,
      glowX: figX - 24,
      poseFront: !charging && !low && !walking && !done,
      poseAim: done,
      isDone: done, notDone: !done,
      showBlast: done && !saver,
      slamAnim: done && !saver ? 'hslam 4s cubic-bezier(0.2,0.9,0.3,1.2) 3' : 'none',
      overtime: Math.max(0, steps - goal).toLocaleString('en-US'),
      coinBg: done ? '#2a0b10' : th.accent,
      muzzleX: figX + 52, muzzleY: 303,
      poseWalk: walking,
      dogSit: !walking && !done && !dogAlertOn, dogAlert: !walking && !done && dogAlertOn, dogHappy: done, dogWalk: walking, dogWalkAlert: walking && dogAlertOn,
      showBadge: badgeOn, notif: nCount, tapIntel: tapper('NOTIFICATIONS'),
      scrollFar: walking && !saver ? 'hscroll 140s linear infinite' : 'none',
      scrollNear: walking && !saver ? 'hscroll 70s linear infinite' : 'none',
      poseReload: charging,
      poseKneel: low,
      figX,
      doneW: Math.round(320 * p),
      accent: th.accent, accentText: th.text,
      neonColor: th.neon, neonGlow: isNight ? 0.8 : 0.4,
      winColor: isNight ? '#e3c463' : '#3a3424',
      isNight,
      wxCloudy: !saver && wx === 'Cloudy', wxFog: !saver && wx === 'Fog / haze', wxSnow: !saver && wx === 'Snow', wxStorm: !saver && wx === 'Thunderstorm', wxRain: !saver && (wx === 'Rain' || wx === 'Thunderstorm' || bd === 'Rainy street'),
      bdNoir: bd === 'Noir city', bdSkyline: bd === 'City skyline', lampGlow: isNight ? 0.35 : 0.15,
      dogX: figX >= 72 ? figX - (walking ? 34 : 26) : figX + 62, bdHotel: bd === 'Grand hotel', bdClub: bd === 'Neon club', bdRain: bd === 'Rainy street', bdSubway: bd === 'Subway',
      bountyLabel: isNight ? "TONIGHT'S BOUNTY" : "TODAY'S BOUNTY",
      steps: steps.toLocaleString('en-US'), goal: goal.toLocaleString('en-US'),
      farX: 0, nearX: 0,
      swayAnim: sway ? 'hsway 6s ease-in-out infinite' : 'none',
      swayAnim2: sway ? 'hsway2 6s ease-in-out infinite' : 'none',
      tapTime: tapper('ALARM'), tapHeart: tapper('HEART RATE'), tapBounty: tapper('STEPS'),
      hasToast: !!st.toast, toast: st.toast || ''
    };
  }
}
</script>
